          title: Juan Jose Esteve-Paredes
          subtitle: |
            I am a postdoc researcher working in theoretical condensed matter physics at the Centro de Física de Materiales (CSIC-EHU) in Donostia-San Sebastián, Spain.

            I study how materials respond to light, where I use quantum mechanics to describe the interaction of electrons and light in periodic systems. My current research interests fall into these categories:

            - **Piezo- and flexo-photovoltaics:** I am working in the description of the bulk photovoltaic effect (BPVE) in layered materials under uniform and local strain.
            - **Photovoltaic effect in metasurfaces:** my current work consists in the description of exciton-photon interaction in photonic metasurfaces and its effect in the BPVE.
            - **Computational methods:** I am developer of the OPTIX code for the study of optical responses in solids (download from the [XATU repository](https://github.com/xatu-code/opticx)).
          buttons:
